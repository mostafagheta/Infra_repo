---
- name: Prepare VPA source directory
  ansible.builtin.file:
    path: "{{ vpa_source_dir }}"
    state: directory
    owner: eks-manager
    group: eks-manager
    mode: '0755'
  become: true
  become_user: root

- name: Clone Kubernetes Autoscaler repository
  ansible.builtin.git:
    repo: "{{ vpa_repo_url }}"
    dest: "{{ vpa_source_dir }}"
    version: "{{ vpa_repo_version }}"
    update: true

- name: Install OpenSSL 1.1 for VPA certificate generation
  ansible.builtin.package:
    name: openssl11
    state: present
  become: true
  become_user: root

- name: Make OpenSSL 1.1 the VPA script default
  ansible.builtin.file:
    src: /usr/bin/openssl11
    dest: /usr/local/bin/openssl
    state: link
    force: true
  become: true
  become_user: root

- name: Install Vertical Pod Autoscaler
  ansible.builtin.command:
    cmd: ./hack/vpa-up.sh
    chdir: "{{ vpa_source_dir }}/vertical-pod-autoscaler"
  environment:
    PATH: "/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: vpa_install
  changed_when: true
