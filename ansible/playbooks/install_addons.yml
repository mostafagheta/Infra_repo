---
- name: install addons
  hosts: bastion
  gather_facts: false
  become: true
  become_user: eks-manager
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Ensure pip3 is installed
      ansible.builtin.package:
        name: python3-pip
        state: present
      become: true
  roles:
    - role: common_kubeconfig
      tags: kubeconfig
    - role: metrics_server
      tags: metrics
    - role: prometheus_stack
      tags: prometheus
    - role: argocd
      tags: argo
    - role: vpa
      tags: vpa
    - role: aws_lb_controller
      tags: alb
    - role: external_secrets
      tags: ext-scrt
    - role: velero
      tags: velero
