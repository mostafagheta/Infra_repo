all:
  vars:
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    bastion:
      ansible_host: 54.93.122.229
      ansible_user: ec2-user
      ansible_become: true
      ansible_become_user: eks-manager
  children:
    eks_workers:
      hosts:
        worker-1:
          ansible_host: 10.0.1.49
          ansible_user: ec2-user
        worker-2:
          ansible_host: 10.0.3.207
          ansible_user: ec2-user
        worker-3:
          ansible_host: 10.0.2.245
          ansible_user: ec2-user
      vars:
        ansible_ssh_common_args: "-o ProxyJump=ec2-user@54.93.122.229"
